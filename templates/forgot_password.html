{% extends "base.html" %}

{% block title %}Forgot Password{% endblock %}

{% block content %}
<header class="header">
    <h1>Forgot Password</h1>
    <p class="tagline">Enter your email to receive a reset code</p>
</header>

<div class="form-container compact">
    <form action="/forgot-password" method="POST">
        <div class="field-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="your@email.com" required autofocus>
        </div>

        <button type="submit" class="submit-btn">Send Reset Code</button>
    </form>

    <div class="form-footer">
        <p>Remember your password? <a href="/login">Log in</a></p>
    </div>
</div>
{% endblock %}
